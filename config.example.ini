# CmdKeyMapper 配置示例
# 每行一个映射，格式：Cmd+按键=Ctrl+按键
# 删除某行或用 # 注释掉，即可停用该映射；未列出的 Win 组合（Win+E、Win+D 等）保持系统原样
# 修改保存后，右键托盘图标选择「重新加载配置」即可生效
# 源修饰键可写 Cmd 或 Win；目标修饰键可写 Ctrl 或 Control；按键支持 A-Z、0-9
# 物理 Shift 会自动叠加，⌘+Shift+Z 即 Ctrl+Shift+Z，无需单独配置

Cmd+C=Ctrl+C
Cmd+V=Ctrl+V
Cmd+X=Ctrl+X
Cmd+Z=Ctrl+Z
Cmd+A=Ctrl+A
Cmd+S=Ctrl+S
Cmd+F=Ctrl+F
Cmd+T=Ctrl+T
Cmd+W=Ctrl+W
Cmd+N=Ctrl+N
Cmd+O=Ctrl+O
Cmd+P=Ctrl+P
Cmd+Y=Ctrl+Y
